version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Connect environment variables to the Vite build
        - echo "VITE_CLIENT_ID=$VITE_CLIENT_ID" >> .env
        - echo "VITE_AWS_REGION=$VITE_AWS_REGION" >> .env
        - echo "VITE_USER_POOL_ID=$VITE_USER_POOL_ID" >> .env
        - echo "VITE_USER_POOL_CLIENT_ID=$VITE_USER_POOL_CLIENT_ID" >> .env
        - echo "VITE_API_GATEWAY_URL=$VITE_API_GATEWAY_URL" >> .env
        - cd aws-architecture/frontend && npm run build
  artifacts:
    baseDirectory: aws-architecture/frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - aws-architecture/frontend/node_modules/**/*
