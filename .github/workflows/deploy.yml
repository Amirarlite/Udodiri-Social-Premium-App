name: Deploy Udodiri Social Club

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install AWS CDK
      run: |
        npm install -g aws-cdk
    
    - name: Install Dependencies
      run: |
        cd aws-architecture
        npm install
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Deploy Infrastructure
      run: |
        cd aws-architecture
        cdk bootstrap
        cdk deploy --all --require-approval never
    
    - name: Build Frontend
      run: |
        if [ -d "frontend" ]; then
          cd frontend
          npm install
          npm run build
        fi
    
    - name: Deploy to S3
      run: |
        if [ -d "frontend/build" ]; then
          aws s3 sync frontend/build/ s3://udodiri-social-club-frontend --delete
        elif [ -d "frontend/dist" ]; then
          aws s3 sync frontend/dist/ s3://udodiri-social-club-frontend --delete
        else
          echo "No frontend build found, skipping S3 deployment"
        fi
    
    - name: Invalidate CloudFront Cache
      run: |
        CLOUDFRONT_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Comment, 'Udodiri') || contains(Comment, 'udodiri')].Id" --output text)
        if [ ! -z "$CLOUDFRONT_ID" ]; then
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"
        fi
